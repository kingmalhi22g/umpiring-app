# Deploy to Firebase Hosting on every push to main.
# Originally generated by the Firebase CLI; customised to:
#  • cancel an in-flight deploy when a newer push lands (concurrency), and
#  • treat a no-op redeploy (content already live) as success instead of a
#    hard failure. Firebase rejects releasing a version identical to the one
#    already live with "...is the current active version" — that's benign.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

# Only one live deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to Firebase Hosting (tolerate no-op redeploys)
        env:
          FIREBASE_SERVICE_ACCOUNT_TALLY_STATS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TALLY_STATS }}
        run: |
          set -euo pipefail
          # The service-account key authenticates firebase-tools (same as the
          # official action does internally via Application Default Credentials).
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_TALLY_STATS" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"

          set +e
          out=$(npx firebase-tools@latest deploy --only hosting:app --project tally-stats --json 2>&1)
          code=$?
          set -e
          echo "$out"

          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          # Content identical to what's already live — nothing to release.
          if echo "$out" | grep -q 'is the current active version'; then
            echo "::notice::Hosting content already live — treating this redeploy as a successful no-op."
            exit 0
          fi
          echo "::error::Firebase deploy failed."
          exit "$code"
